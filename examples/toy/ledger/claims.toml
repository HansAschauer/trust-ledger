[claim.lem-succ]
text = "For every n, f(n) > n."
label = "lem:succ"
evidence = "E1"
lean = ["Toy.lem"]

[claim.thm-twice]
text = "Under the Banach property, f(f(n)) > n."
label = "thm:twice"
evidence = "E1"
lean = ["Toy.thm"]
uses = ["lem-succ"]
cites = ["banach"]

[claim.conj-general]
text = "The statement holds for all iterates."
evidence = "E5"
uses = ["thm-twice"]

[citation.banach]
key = "Banach1932"
statement = "Every complete normed space satisfies BanachProp."
source = "Thm 2.1"

[assertion.conj-general-hint]
claim = "conj-general"
text = "Checked numerically for k <= 10 only."
