[project]
name = "toy"

[adapter.lean]
prefix = "lean:"             # claims list declaration names under `lean`
dump = "lean.json"           # adapter dump (docs/FORMAT.md 2.6), converted from the hand-made Dump.lean output:
extract = "python3 ../../adapters/lean.py --from ledger/lean-dump.json"
# in a real project: extract = "ledger/dump.sh | python3 adapters/lean.py"  (names on stdin -> Dump.lean -> adapter)

[adapter.proverif]
prefix = "pv:"               # node ids are pv:<reference>; claims list references under `proverif`
dump = "proverif.json"       # adapter dump (docs/FORMAT.md 2.6); hand-made here, no ProVerif needed
# extract = "python3 ../../adapters/proverif.py"  # references on stdin, dump on stdout

[paper.toy]
main = "paper/main.tex"

[generated]
dirs = ["paper/ledger"]   # written by the ledger; never part of the hashed source
